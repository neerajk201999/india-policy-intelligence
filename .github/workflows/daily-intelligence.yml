name: Daily intelligence refresh

on:
  schedule:
    # India Standard Time is UTC+05:30 and does not observe daylight saving.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF extraction support
        run: python -m pip install -r requirements.txt

      - name: Run research pipeline
        run: python -m app.run --lookback-days 5 --max-items 30 --verbose
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}

      - name: Export website data
        run: python scripts/export_web.py

      - name: Verify application and publication
        run: |
          python -m compileall -q app tests scripts
          python -m unittest discover -s tests -v
          python -m json.tool web/data/latest.json >/dev/null

      - name: Commit the edition and persistent state
        run: |
          git config user.name "policy-intelligence-bot"
          git config user.email "policy-intelligence-bot@users.noreply.github.com"
          git add data/intelligence.db reports/daily web/data/latest.json
          if git diff --cached --quiet; then
            echo "No material publication change"
          else
            git commit -m "data: publish daily intelligence $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
