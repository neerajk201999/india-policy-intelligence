name: Daily intelligence refresh

on:
  schedule:
    # India Standard Time is UTC+05:30 and does not observe daylight saving.
    # GitHub cron is best-effort and has been observed starting 5+ hours late.
    # Hourly attempts let the first delayed event reaching 07:00 IST publish;
    # the gate below skips early and already-completed attempts.
    - cron: "30 20-23 * * *"
    - cron: "30 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this attempt should publish
        id: gate
        run: echo "run=$(python scripts/refresh_gate.py --event '${{ github.event_name }}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF extraction support
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run research pipeline
        if: steps.gate.outputs.run == 'true'
        run: python -m app.run --lookback-days 5 --max-items 30 --verbose
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}

      - name: Export website data
        if: steps.gate.outputs.run == 'true'
        run: python scripts/export_web.py

      - name: Verify application and publication
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m compileall -q app tests scripts
          python -m unittest discover -s tests -v
          python -m json.tool web/data/latest.json >/dev/null

      - name: Commit the edition and persistent state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "policy-intelligence-bot"
          git config user.email "policy-intelligence-bot@users.noreply.github.com"
          git add data/intelligence.db reports/daily web/data/latest.json
          if git diff --cached --quiet; then
            echo "No material publication change"
          else
            git commit -m "data: publish daily intelligence $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
