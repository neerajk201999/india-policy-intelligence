<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verified Indian policy and regulatory developments, explained clearly and linked to authoritative sources.">
  <meta name="theme-color" content="#f5f1e8">
  <title>India Policy Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231b1b17%22/><text x=%2250%22 y=%2267%22 text-anchor=%22middle%22 fill=%22%23f5f1e8%22 font-size=%2250%22 font-family=%22serif%22>IP</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">Skip to policy updates</a>
  <header class="site-header">
    <a class="wordmark" href="/" data-route aria-label="India Policy Intelligence home">
      <span class="wordmark-mark" aria-hidden="true">IP</span>
      <span>India Policy Intelligence</span>
    </a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/" data-route data-nav="briefing">Briefing</a>
      <a href="/tracker" data-route data-nav="tracker">Tracker</a>
      <a href="/watchlist" data-route data-nav="watchlist">Watchlist</a>
    </nav>
    <p class="header-updated" id="header-updated">Updating…</p>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="page-intro" aria-labelledby="page-title">
      <p class="section-label" id="page-label">Daily briefing</p>
      <div class="intro-line">
        <div>
          <h1 id="page-title">Today’s verified developments</h1>
          <p class="intro-copy" id="page-description">Verified regulatory and policy developments from the last 24 hours.</p>
        </div>
        <p class="edition" id="edition">—</p>
      </div>
    </section>

    <div id="route-view" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <span>India Policy Intelligence</span>
    <div>
      <a href="https://github.com/neerajk201999/india-policy-intelligence/blob/main/docs/ARCHITECTURE.md" target="_blank" rel="noreferrer">About this briefing</a>
      <a href="https://github.com/neerajk201999/india-policy-intelligence/blob/main/config/sources.yaml" target="_blank" rel="noreferrer">Sources & methodology</a>
    </div>
  </footer>

  <template id="controls-template">
    <section class="controls" aria-label="Policy update controls">
      <div class="category-filters" role="group" aria-label="Filter by policy area"></div>
      <div class="control-row">
        <label class="search-control">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
          <span class="sr-only">Search policy updates</span>
          <input type="search" placeholder="Search policy updates" autocomplete="off">
        </label>
        <div class="secondary-controls"></div>
      </div>
    </section>
  </template>

  <template id="event-template">
    <article class="policy-event">
      <div class="event-topline">
        <span class="event-area"></span>
        <span class="event-status"></span>
        <span class="verification"><i aria-hidden="true">✓</i><span></span></span>
      </div>
      <h2 class="event-title"><a data-route></a></h2>
      <div class="event-body">
        <section>
          <h3>What changed</h3>
          <p class="event-summary"></p>
        </section>
        <aside>
          <h3>Why it matters</h3>
          <p class="event-why"></p>
        </aside>
      </div>
      <div class="event-metadata"></div>
      <div class="event-sources"></div>
    </article>
  </template>

  <template id="briefing-template">
    <article class="briefing-entry">
      <div class="briefing-index"></div>
      <div class="briefing-main">
        <div class="event-topline"><span class="event-area"></span><span class="event-status"></span><span class="verification"><i aria-hidden="true">✓</i><span></span></span></div>
        <h2><a data-route></a></h2>
        <p class="briefing-summary"></p>
        <div class="briefing-footer"><span class="briefing-institution"></span><a data-route>Read the analysis →</a></div>
      </div>
    </article>
  </template>

  <template id="tracker-template">
    <article class="tracker-entry">
      <div class="tracker-date"></div>
      <div>
        <div class="event-topline"><span class="event-area"></span><span class="event-status"></span></div>
        <h2><a data-route></a></h2>
        <p class="tracker-summary"></p>
        <div class="tracker-footer"><span class="tracker-institution"></span><a data-route>Open development →</a></div>
      </div>
    </article>
  </template>

  <template id="watch-template">
    <article class="watch-entry">
      <div class="watch-state"></div>
      <div>
        <p class="event-area"></p>
        <h2><a data-route></a></h2>
        <p class="watch-next"></p>
        <p class="watch-last"></p>
      </div>
      <a class="watch-open" data-route aria-label="Open watchlist development">→</a>
    </article>
  </template>

  <script src="/config.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
